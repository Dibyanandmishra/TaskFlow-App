version: '3.8'

services:
  api:
    build: .
    container_name: taskflow-api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/taskflow
      - JWT_SECRET=${JWT_SECRET}
      - BCRYPT_SALT_ROUNDS=12
      - CORS_ORIGIN=*
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - taskflow-network

  mongo:
    image: mongo:7
    container_name: taskflow-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - taskflow-network

volumes:
  mongo-data:
    driver: local

networks:
  taskflow-network:
    driver: bridge
